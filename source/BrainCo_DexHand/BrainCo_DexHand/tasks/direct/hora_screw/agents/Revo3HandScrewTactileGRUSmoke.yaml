# Smoke config for GRU student tactile encoder (small num_envs in train.py).
# Usage:
#   python scripts/hora/train.py --task nutbolt_tactile --train_cfg Revo3HandScrewTactileGRUSmoke \
#     --num_envs 64 --headless --max_iterations 2

algo: PPO
tactile_layout: estimated_official
network:
  mlp:
    units: [512, 256, 128]
  priv_mlp:
    units: [256, 128, 32]
  tactile_encoder:
    type: mlp
  student_tactile_encoder:
    type: gru
    gated_fusion: true
    gru:
      hidden_dim: 128
      num_layers: 1
      bidirectional: true
      dropout: 0.0
      pool: last

load_path: ''

ppo:
  output_name: 'debug'
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: 64
  normalize_advantage: True
  # Coordination is an intrinsic environment bonus in the standard PPO return.
  separate_coord_advantage: False
  reward_scale: 1.0
  gamma: 0.99
  tau: 0.95
  learning_rate: 5e-3
  kl_threshold: 0.02
  horizon_length: 8
  minibatch_size: 512
  mini_epochs: 2
  clip_value: True
  critic_coef: 4
  entropy_coef: 0.0
  e_clip: 0.2
  bounds_loss_coef: 0.0001
  truncate_grads: True
  grad_norm: 1.0
  save_best_after: 0
  save_frequency: 500
  max_agent_steps: 1000000000
  priv_info: True
  priv_info_dim: 331
  priv_info_embed_dim: 32
  proprio_adapt: False
