# Minimal smoke-test config for HORA Revo3 tactile screw tasks: tiny batches, few epochs.
# Usage: --train_cfg Revo3HandScrewTactileSmoke --num_envs 128

algo: PPO
tactile_layout: estimated_official
network:
  mlp:
    units: [512, 256, 128]
  priv_mlp:
    units: [256, 128, 32]
  tactile_encoder:
    type: mlp
  student_tactile_encoder:
    type: conv1d
    gated_fusion: false
    distill_dim: 32
    output_dim: 128

load_path: ''

ppo:
  output_name: 'debug'
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: 128
  normalize_advantage: True
  # Coordination is an intrinsic environment bonus in the standard PPO return.
  separate_coord_advantage: False
  reward_scale: 1.0
  gamma: 0.99
  tau: 0.95
  learning_rate: 5e-3
  kl_threshold: 0.02
  horizon_length: 8
  minibatch_size: 1024
  mini_epochs: 2
  clip_value: True
  critic_coef: 4
  entropy_coef: 0.0
  e_clip: 0.2
  bounds_loss_coef: 0.0001
  truncate_grads: True
  grad_norm: 1.0
  save_best_after: 0
  save_frequency: 1
  max_agent_steps: 4096   # ~4 epochs at 128 envs x 8 horizon
  priv_info: True
  priv_info_dim: 331   # 11 base + teacher frame 320 ([Fx,Fy,Fz,d] x 80)
  priv_info_embed_dim: 32
  proprio_adapt: False
