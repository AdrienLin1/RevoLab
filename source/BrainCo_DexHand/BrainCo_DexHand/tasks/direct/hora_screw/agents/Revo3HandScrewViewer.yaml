# Long-running, memory-safe GUI training config for HORA Revo3 screw tasks.
# Intended for inspecting behavior, not for maximum-throughput teacher training.
# Usage: --train_cfg Revo3HandScrewViewer --num_envs 128

algo: PPO
network:
  mlp:
    units: [512, 256, 128]
  priv_mlp:
    units: [256, 128, 8]

load_path: ''

ppo:
  output_name: 'debug'
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: 128
  normalize_advantage: True
  reward_scale: 1.0
  gamma: 0.99
  tau: 0.95
  learning_rate: 5e-3
  kl_threshold: 0.02
  horizon_length: 8
  minibatch_size: 1024
  mini_epochs: 5
  clip_value: True
  critic_coef: 4
  entropy_coef: 0.0
  e_clip: 0.2
  bounds_loss_coef: 0.0001
  truncate_grads: True
  grad_norm: 1.0
  save_best_after: 0
  save_frequency: 500
  max_agent_steps: 1000000000
  priv_info: True
  priv_info_dim: 11
  priv_info_embed_dim: 8
  proprio_adapt: False
