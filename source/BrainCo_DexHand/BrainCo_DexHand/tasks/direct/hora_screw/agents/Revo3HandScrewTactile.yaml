# Training config for HORA Revo3 tactile screw/valve tasks.
# Stage1 teacher: flat priv_mlp over priv_info; ppo.priv_info_dim is synced from env.
# Stage2 student: conv1d over binary tactile history (see student_tactile_encoder).
# num_actors is overridden at runtime from env.num_envs.

algo: PPO
tactile_layout: estimated_official
network:
  mlp:
    units: [512, 256, 128]
  priv_mlp:
    units: [256, 128, 32]
  tactile_encoder:
    type: mlp
  student_tactile_encoder:
    type: conv1d
    gated_fusion: false
    distill_dim: 32
    output_dim: 128

load_path: ''   # path to checkpoint; overridden by --checkpoint CLI arg

ppo:
  output_name: 'debug'
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: 16384          # overridden at runtime from env.num_envs
  normalize_advantage: True
  # Coordination is an intrinsic environment bonus in the standard PPO return.
  separate_coord_advantage: False
  # dexscrew PPO does not scale rewards (hora_rotation uses 0.01)
  reward_scale: 1.0
  gamma: 0.99
  tau: 0.95
  learning_rate: 1e-3
  kl_threshold: 0.01
  horizon_length: 8
  # Preferred maximum. train.py reduces this to the largest exact divisor of
  # num_envs * horizon_length when a different environment count is requested.
  minibatch_size: 32768
  mini_epochs: 5
  clip_value: True
  critic_coef: 4
  entropy_coef: 0.0
  e_clip: 0.2
  bounds_loss_coef: 0.0001
  truncate_grads: True
  grad_norm: 1.0
  save_best_after: 0
  save_frequency: 500
  max_agent_steps: 1000000000
  priv_info: True
  priv_info_dim: 331   # regular_grid placeholder; train.py syncs from env at runtime
  priv_info_embed_dim: 32
  proprio_adapt: False
  # Stage2 only (ignored by MLP teacher Stage1): μ distill + optional z distill
  tactile_distill_coef: 0.0
