# Training config for HORA Revo3 screw tasks (nut-bolt / screwdriver) in Isaac Lab.
# num_actors is overridden at runtime from env.num_envs.

algo: PPO
network:
  mlp:
    units: [512, 256, 128]
  priv_mlp:
    units: [256, 128, 32]
  tactile_layout_encoder:
    mode: auto
    layout: estimated_official # runtime sync; regular_grid remains the default
    regular_grid_backend: cnn
    estimated_official_backend: gnn
    history_mode: cross_attention  # set legacy_self_attention for old CNN checkpoints
    finger_names: []       # runtime sync from active tactile fingers
    teacher_frame_dim: 0   # runtime sync from the environment
    student_frame_dim: 0
    graph:
      node_dim: 32
      ordinary_knn: 3
      thumb_knn: 4
      query_heads: 2
      distill_dim: 32
      shift_distill_weight: 0.75
      encode_chunk_size: 512
      gradient_checkpointing: true
      max_minibatch_size: 512
    history:
      layers: 2
      heads: 4

load_path: ''   # path to checkpoint; overridden by --checkpoint CLI arg

ppo:
  output_name: 'debug'
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: 16384          # overridden at runtime from env.num_envs
  normalize_advantage: True
  # dexscrew PPO does not scale rewards (hora_rotation uses 0.01)
  reward_scale: 1.0
  gamma: 0.99
  tau: 0.95
  learning_rate: 5e-3
  kl_threshold: 0.02
  horizon_length: 8
  # Preferred maximum. train.py reduces this to the largest exact divisor of
  # num_envs * horizon_length when a different environment count is requested.
  minibatch_size: 32768
  mini_epochs: 5
  clip_value: True
  critic_coef: 4
  entropy_coef: 0.0
  e_clip: 0.2
  bounds_loss_coef: 0.0001
  truncate_grads: True
  grad_norm: 1.0
  save_best_after: 0
  save_frequency: 500
  max_agent_steps: 100000000
  priv_info: True
  priv_info_dim: 11
  priv_info_embed_dim: 32
  proprio_adapt: False
