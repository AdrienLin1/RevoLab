# Hierarchical Stage-1 teacher (21-D hand master) + 2-D FINE-COMPENSATION
# follower on a compliant mount (task `valvedriver_tactile_xy96`).
#
#   python scripts/hora/train.py --task valvedriver_tactile_xy96 \
#       --algo HierarchicalPPO --train_cfg valvedriver_tactile_frame813_xy96
#
# Every learning hyper-parameter below is IDENTICAL to
# valvedriver_tactile_frame813_xy.yaml, and so is the environment's REWARD. The
# xy96 task differs only in the stage MECHANICS (travel envelope, rate envelope,
# mount compliance), so a run of this config against a run of the xy config is a
# clean A/B of the stage design and nothing else. Note that raw return is still
# only comparable because the reward is identical -- compare physical metrics
# (net rotation, success rate, handover recovery) regardless. The follower
# observation is still 159-dim and the master interface is untouched, so the
# same 21-D Stage-1 checkpoint loads strictly through --master_checkpoint.
#
# The three deliberate deviations from the baseline yaml are all SCHEDULE, not
# learner tuning, and all live in the `hierarchical` block below:
# joint_finetune_enable, activation_speed_threshold (1.1 rad/s, not 0.8) and
# xy_curriculum_ramp_steps (0 -- no Stage-1 ramp). Label runs accordingly.

algo: HierarchicalPPO
tactile_layout: estimated_official

network:
  mlp:
    units: [512, 256, 128]

  # Retained for checkpoint-compatible legacy tactile_encoder.type=mlp configs.
  # The finger_attention_gru teacher does not instantiate or use priv_mlp.
  priv_mlp:
    units: [256, 128, 32]

  tactile_encoder:
    type: finger_attention_gru
    node_channels: [u, v, b, d, Fn, Ft1, Ft2]
    node_input_dim: 7
    node_source_channels: [0, 3, 5, 6, 7]
    teacher_node_frame_channels: 10
    finger_context_channels: 4
    finger_token_dim: 32
    finger_mlp_hidden_dim: 64
    attention_heads: 4
    attention_ff_dim: 64
    # The follower consumes exactly this GRU hidden state (128 dims).
    gru_hidden_dim: 128
    gru_num_layers: 1
    gru_bidirectional: false
    history_len: 10

  # Stage-2 student behavior and checkpoint format remain unchanged.
  student_tactile_encoder:
    type: conv1d
    gated_fusion: false
    distill_dim: 32
    output_dim: 128

load_path: ''
master_load_path: ''

# ---- master PPO (21-D hand policy) ----
ppo:
  output_name: 'debug'
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: 16384
  normalize_advantage: True
  separate_coord_advantage: False
  reward_scale: 1.0
  gamma: 0.99
  tau: 0.95
  learning_rate: 1e-3
  kl_threshold: 0.01
  horizon_length: 8
  minibatch_size: 4096
  mini_epochs: 5
  clip_value: True
  critic_coef: 4
  entropy_coef: 0.0
  e_clip: 0.2
  bounds_loss_coef: 0.0001
  truncate_grads: True
  grad_norm: 1.0
  save_best_after: 0
  save_frequency: 500
  max_agent_steps: 1000000000
  priv_info: True
  # Five-finger valve placeholder (11 base + 1170 tactile). Runtime syncs this
  # to the task-resolved value before saving.
  priv_info_dim: 1181
  priv_info_embed_dim: 32
  proprio_adapt: False
  tactile_distill_coef: 0.0

# ---- follower PPO (2-D horizontal translation policy) ----
# The actor input is the strict 159-dim follower observation:
#   21 executed hand action + 128 master GRU tactile latent
#   + 2 xy position + 2 xy velocity + 2 xy target
#   + 2 previous xy action + 2 workspace margin
follower:
  actor_units: [256, 128, 64]
  critic_units: [256, 128, 64]
  # Centralized critic only: the first 11 base privileged channels. They never
  # reach the follower actor.
  critic_priv_dim: 11
  init_log_sigma: -1.0
  learning_rate: 3e-4
  kl_threshold: 0.016
  mini_epochs: 5
  minibatch_size: 8192
  e_clip: 0.2
  critic_coef: 2.0
  entropy_coef: 0.005
  bounds_loss_coef: 0.0001
  truncate_grads: True
  grad_norm: 1.0
  weight_decay: 0.0
  normalize_input: True
  normalize_value: True

# ---- global latched curriculum ----
hierarchical:
  # Stage 0 -> Stage 1 gate on the EMA of the per-rollout signed mean angular
  # velocity. This threshold is ONLY a curriculum trigger, never a reward gate.
  # Raised from the baseline 0.8 to 1.1 rad/s: the follower is handed a hand
  # policy that already turns the valve fast, so the stage is asked to trim a
  # competent gait instead of propping up a marginal one.
  activation_speed_threshold: 0.9
  activation_patience: 5
  activation_speed_ema_beta: 0.9
  # Stage 1 -> Stage 2. With this OFF the hand policy stays frozen and every
  # measured change is attributable to the follower alone, which is the clean
  # ablation. With it ON the two policies co-adapt, which is what a frozen hand
  # provably cannot do -- a frozen hand can only be disturbed by stage motion,
  # never exploit it. Whichever is used, label the run accordingly: the two are
  # different experiments, not different tunings of one.
  joint_finetune_enable: True
  follower_only_steps: 50000000
  master_finetune_lr_scale: 0.07
  master_kl_coef: 1.0
  freeze_tactile_encoder_in_joint_finetune: true
  # Stage-1 workspace / action-scale ramp DISABLED (0 -> progress latches to
  # 1.0 the moment Stage 1 activates). The follower gets its full travel and
  # rate envelope immediately; the xy96 envelope is already the tight one
  # (15 mm / 1 mm per unit action), so there is nothing left to ease into.
  # The env cfg additionally pins initial == final, so neither knob is
  # curriculum-limited even if a resumed checkpoint reports progress < 1.
  xy_curriculum_ramp_steps: 0
