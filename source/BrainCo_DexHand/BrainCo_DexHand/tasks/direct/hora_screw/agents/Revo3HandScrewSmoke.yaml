# Minimal smoke-test config for HORA Revo3 screw tasks: tiny batches, few epochs.
# Usage: --train_cfg Revo3HandScrewSmoke --num_envs 128

algo: PPO
network:
  mlp:
    units: [512, 256, 128]
  priv_mlp:
    units: [256, 128, 32]
  tactile_layout_encoder:
    mode: auto
    layout: regular_grid
    regular_grid_backend: cnn
    estimated_official_backend: gnn
    history_mode: cross_attention
    finger_names: []
    teacher_frame_dim: 0
    student_frame_dim: 0
    graph: {node_dim: 32, ordinary_knn: 3, thumb_knn: 4, query_heads: 2, distill_dim: 32, shift_distill_weight: 0.75, encode_chunk_size: 512, gradient_checkpointing: true, max_minibatch_size: 512}
    history: {layers: 1, heads: 4}

load_path: ''

ppo:
  output_name: 'debug'
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: 128
  normalize_advantage: True
  reward_scale: 1.0
  gamma: 0.99
  tau: 0.95
  learning_rate: 5e-3
  kl_threshold: 0.02
  horizon_length: 8
  minibatch_size: 1024
  mini_epochs: 2
  clip_value: True
  critic_coef: 4
  entropy_coef: 0.0
  e_clip: 0.2
  bounds_loss_coef: 0.0001
  truncate_grads: True
  grad_norm: 1.0
  save_best_after: 0
  save_frequency: 1
  max_agent_steps: 4096   # ~4 epochs at 128 envs x 8 horizon
  priv_info: True
  priv_info_dim: 11
  priv_info_embed_dim: 32
  proprio_adapt: False
