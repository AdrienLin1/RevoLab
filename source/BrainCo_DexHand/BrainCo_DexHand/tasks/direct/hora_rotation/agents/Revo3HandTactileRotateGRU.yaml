# Stage1 teacher: flat privileged MLP.
# Stage2 student: GRU over the tactile structural history.

algo: PPO
tactile_layout: regular_grid
network:
  mlp:
    units: [512, 256, 128]
  priv_mlp:
    units: [256, 128, 32]
  tactile_encoder:
    type: mlp
  student_tactile_encoder:
    type: gru
    gated_fusion: true
    gru:
      hidden_dim: 256
      num_layers: 1
      bidirectional: true
      dropout: 0.0
      pool: last

load_path: ''

ppo:
  output_name: 'debug'
  normalize_input: True
  normalize_value: True
  value_bootstrap: True
  num_actors: 16384
  normalize_advantage: True
  reward_scale: 1.0
  gamma: 0.99
  tau: 0.95
  learning_rate: 5e-3
  kl_threshold: 0.02
  horizon_length: 8
  minibatch_size: 32768
  mini_epochs: 5
  clip_value: True
  critic_coef: 4
  entropy_coef: 0.0
  e_clip: 0.2
  bounds_loss_coef: 0.0001
  truncate_grads: True
  grad_norm: 1.0
  save_best_after: 0
  save_frequency: 500
  max_agent_steps: 300000000
  priv_info: True
  priv_info_dim: 328
  priv_info_embed_dim: 32
  proprio_adapt: False
  tactile_distill_coef: 0.0
